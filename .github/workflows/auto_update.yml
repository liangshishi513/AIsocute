name: Daily AI News Kanban Update

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00) 和 20:00 (UTC 12:00) 自动运行
    - cron: '0 1,12 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动一键触发测试

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch news & summarize with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Commit and push updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: 自动更新每日 AI 资讯与开源项目"
          git push
